<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Proposta CALI</title><link rel="stylesheet" href="/styles.css"></head><body><header class="proposal-toolbar"><div class="shell proposal-toolbar-inner"><div><strong>Prévia da proposta</strong><div style="font-size:11px;color:#cfc7c3">Confira antes de salvar o PDF e enviar.</div></div><div class="proposal-toolbar-actions"><a class="btn btn-soft" href="/admin">← Painel</a><button class="btn btn-gold" id="print">Salvar PDF</button><button class="btn btn-primary" id="open-send">Enviar por e-mail</button></div></div></header><main id="proposal-root"><div class="empty">Carregando proposta…</div></main><div class="drawer-overlay" id="send-overlay"></div><aside class="drawer" id="send-drawer"><div class="drawer-head"><div><div class="eyebrow" style="margin:0;color:#DDBB7F">Envio aprovado</div><h2>Enviar proposta</h2><p id="send-to"></p></div><button class="icon-btn" id="close-send">×</button></div><div class="drawer-body"><div class="drawer-section"><h3>1. Salve o PDF</h3><p>Use o botão “Salvar PDF”, confira o arquivo e depois selecione a versão aprovada abaixo.</p></div><div class="drawer-section"><h3>2. Anexe e envie</h3><div class="field"><label for="pdf-file">Proposta final em PDF</label><input class="control" id="pdf-file" type="file" accept="application/pdf,.pdf"></div><div class="field" style="margin-top:14px"><label for="email-note">Mensagem adicional, se quiser</label><textarea class="control" id="email-note" placeholder="Mensagem curta que aparecerá antes da assinatura."></textarea></div><div class="auth-feedback" id="send-feedback"></div></div></div><div class="drawer-footer"><button class="btn btn-primary" id="send-email" disabled>Confirmar envio</button></div></aside><script type="module" src="/js/proposta.js"></script></body></html>
