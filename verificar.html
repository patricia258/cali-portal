<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#5A1E2D">
  <title>Verificar documento · CALI</title>
  <link rel="icon" type="image/svg+xml" href="/assets/cali-favicon.svg?v=20260924-leaf">
  <style>
    :root{--bordo:#5A1E2D;--dourado:#B58C52;--grafite:#2B2B2B;--cinza:#6B5D63;--linha:#E6DDD3}
    *{box-sizing:border-box}
    .hidden{display:none!important}
    body{margin:0;background:#fff;color:var(--grafite);font:15px/1.55 Inter,system-ui,-apple-system,sans-serif}
    .cliente{min-height:100vh;min-height:100dvh;background:#fff;display:flex;flex-direction:column;align-items:center;padding:32px 20px 24px}
    .cliente-logo{width:72px;display:block}
    .cliente-centro{flex:1;width:100%;max-width:400px;display:flex;flex-direction:column;justify-content:center;padding:32px 0}
    .av-fim{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;animation:surgir .28s ease-out}
    .av-fim h1{font-size:22px;font-weight:600;letter-spacing:-.02em;color:var(--grafite);margin:0}
    .av-fim p{margin:0;font-size:14px;color:var(--cinza)}
    .v-auth{width:100%;max-width:400px;font-size:12.5px;color:var(--cinza);text-align:center}
    .v-auth summary{cursor:pointer;list-style:none;padding:8px}
    .v-auth summary::-webkit-details-marker{display:none}
    .v-auth summary b{color:#2D6A4F;font-weight:600;margin-right:4px}
    .v-auth dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:8px 0 0;text-align:left}
    .v-auth dt{color:#9A8F87}
    .v-auth dd{margin:0;color:var(--grafite);overflow-wrap:anywhere}
    .hash{font-family:ui-monospace,Menlo,monospace;font-size:12px!important}
    @keyframes surgir{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
    @media (prefers-reduced-motion:reduce){.av-fim{animation:none}}
  </style>
</head>
<body>
  <main class="cliente">
    <img class="cliente-logo" data-asset="logoBordo" src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" alt="CALI RH">
    <div class="cliente-centro" id="centro"></div>
    <details class="v-auth hidden" id="auth">
      <summary><b>✓</b>Documento autêntico emitido pela CALI RH</summary>
      <dl>
        <dt>Responsável</dt><dd id="auth-responsavel"></dd>
        <dt>Emitido em</dt><dd id="auth-emitido"></dd>
        <dt>Protocolo</dt><dd id="auth-protocolo"></dd>
        <dt>Integridade</dt><dd class="hash" id="auth-hash"></dd>
      </dl>
    </details>
  </main>
  <script type="module" src="/js/assets-init.js"></script>
  <script type="module" src="/js/verificar.js"></script>
</body>
</html>
