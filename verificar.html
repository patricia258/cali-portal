<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#5A1E2D">
  <title>Verificar documento · CALI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <link rel="icon" type="image/svg+xml" href="/assets/cali-favicon.svg?v=20260924-leaf">
  <style>
    .verify-body{--serif:'Playfair Display',Georgia,serif;--sans:'DM Sans',Arial,sans-serif;background:var(--marfim);min-height:100vh}
    .verify-header{padding:28px 0}
    .verify-main{display:grid;place-items:center;padding:20px 0 90px}
    .verify-card{width:min(560px,100%);background:#fff;border:1px solid #EAE1DC;border-radius:16px;padding:40px;text-align:center}
    .verify-badge{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;margin:0 auto 20px;font-size:24px}
    .verify-badge.ok{background:#DDEEE5;color:#24533E}
    .verify-badge.fail{background:#FCE8E8;color:#9B2C2C}
    .verify-card h1{font:500 30px/1.15 var(--serif);color:var(--bordo);margin:0 0 8px}
    .verify-card p.lead{color:#6d6264;margin:0 0 28px;font-size:14px}
    .verify-grid{display:grid;gap:12px;text-align:left;border-top:1px solid #EFE8E4;padding-top:22px}
    .verify-row{display:flex;justify-content:space-between;gap:14px;font-size:13px}
    .verify-row span:first-child{color:#8D8184;text-transform:uppercase;font-size:10px;letter-spacing:.1em;font-weight:700;padding-top:2px}
    .verify-row span:last-child{color:var(--grafite);font-weight:600;text-align:right}
    .verify-sign{margin-top:26px;padding-top:22px;border-top:1px solid #EFE8E4;font-size:12px;color:#8E8285}
    .verify-sign strong{display:block;color:var(--bordo);font:500 17px/1.2 var(--serif);margin-bottom:2px}
    .verify-foot{margin-top:28px;font-size:11px;color:#9A8E91}
  </style>
</head>
<body class="verify-body">
  <header class="verify-header"><div class="shell-narrow"><a class="brand brand-image" href="/" aria-label="CALI RH"><img data-asset="logoLight" src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" alt="CALI — HR for Business" style="height:34px"></a></div></header>
  <main class="verify-main"><div class="shell-narrow">
    <section class="verify-card" id="card">
      <div class="verify-badge" id="badge">⋯</div>
      <h1 id="title">Verificando…</h1>
      <p class="lead" id="lead">Confirmando a autenticidade deste documento junto à CALI RH.</p>
      <div id="details"></div>
    </section>
  </div></main>
  <script type="module" src="/js/assets-init.js"></script>
  <script type="module" src="/js/verificar.js"></script>
</body>
</html>
