<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#5A1E2D">
  <title>Painel de Propostas · CALI</title><link rel="icon" href="/assets/logo-cali-bordo.png" type="image/png"><link rel="stylesheet" href="/styles.css">
</head>
<body class="admin-body">
  <header class="admin-header"><div class="shell admin-header-inner"><a class="brand brand-image" href="/admin"><img data-asset="logoLight" src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" alt="CALI — HR for Business"></a><div class="admin-user"><a class="btn btn-soft" href="/">Ver portal</a><span id="admin-name">Patrícia</span><button class="btn btn-soft" id="logout">Sair</button></div></div></header>
  <main class="admin-main"><div class="shell">
    <div class="admin-title-row"><div><div class="eyebrow">Painel de propostas</div><h1>Oportunidades</h1><p>Uma única visão para todos os serviços da CALI.</p></div><div class="admin-title-actions"><button class="btn btn-outline" id="export-csv">Baixar CSV</button><button class="btn btn-outline" id="refresh">Atualizar</button></div></div>
    <section class="kpis"><div class="kpi"><div class="kpi-label">Novas</div><div class="kpi-value" id="kpi-new">0</div></div><div class="kpi"><div class="kpi-label">Em análise</div><div class="kpi-value" id="kpi-analysis">0</div></div><div class="kpi"><div class="kpi-label">Propostas enviadas</div><div class="kpi-value" id="kpi-sent">0</div></div><div class="kpi"><div class="kpi-label">Fechadas</div><div class="kpi-value" id="kpi-won">0</div></div></section>
    <section class="filters"><input class="control search" id="search" placeholder="Buscar empresa, contato ou protocolo"><select class="control" id="service-filter"><option value="">Todos os serviços</option></select><select class="control" id="status-filter"><option value="">Todos os status</option></select><button class="btn btn-primary" id="clear">Limpar</button></section>
    <section class="table-card"><div class="table-scroll"><table class="data-table"><thead><tr><th>Entrada</th><th>Empresa / contato</th><th>Serviço</th><th>Momento</th><th>Status</th><th></th></tr></thead><tbody id="table-body"></tbody></table></div><div class="empty hidden" id="empty">Nenhuma resposta encontrada.</div></section>
  </div></main>
  <div class="drawer-overlay" id="overlay"></div><aside class="drawer" id="drawer"><div class="drawer-head"><div><div class="eyebrow" style="margin:0;color:#DDBB7F" id="drawer-code"></div><h2 id="drawer-title">Oportunidade</h2><p id="drawer-subtitle"></p></div><button class="icon-btn" id="close">×</button></div><div class="drawer-body" id="drawer-body"></div><div class="drawer-footer"><button class="btn btn-outline" id="save-review">Salvar análise</button><button class="btn btn-primary" id="save-proposal">Salvar e abrir proposta →</button></div></aside>
  <script type="module" src="/js/assets-init.js"></script><script type="module" src="/js/admin.js"></script>
</body>
</html>
